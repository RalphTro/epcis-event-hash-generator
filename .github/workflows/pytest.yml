name: Unit Tests

on: [push]

# provide the least privilege: the job only needs to read the repo
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # if one Python version fails, still run the others
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      # v4 is current and Node20-safe
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          # stop the build if there are Python syntax errors or undefined names
          flake8 epcis_event_hash_generator --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 epcis_event_hash_generator --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics 

      - name: Test with pytest
        run: |
          pip install pytest
          cd tests
          pytest
